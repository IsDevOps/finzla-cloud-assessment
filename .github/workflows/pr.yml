name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write # OIDC for the read-only plan role
  contents: read
  pull-requests: write # so the plan can be posted as a PR comment

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt / validate / plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: terraform fmt (check only, whole repo)
        run: terraform fmt -check -recursive ..
        working-directory: terraform

      # Credentials must be configured BEFORE init, not after: init
      # itself talks to the S3 backend and fails without them. Without
      # a plan role configured yet (e.g. before the first terraform
      # apply has ever run), fall back to a local, backend-less init
      # so fmt/validate can still run on every PR regardless.
      - name: Configure AWS credentials (read-only plan role)
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: terraform init (remote backend)
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        run: terraform init -input=false

      - name: terraform init (local backend — no plan role configured yet)
        if: ${{ vars.AWS_PLAN_ROLE_ARN == '' }}
        run: terraform init -input=false -backend=false

      - name: terraform validate
        run: terraform validate

      # Plan needs real AWS credentials. This role is read-only
      # (ec2:Describe*, ecs:Describe*, iam:Get*/List*, ...) — it can
      # never create, modify, or delete anything, so a PR from a fork
      # or an untrusted branch can see a plan but cannot apply one.
      - name: terraform plan
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        run: terraform plan -input=false -no-color -out=tfplan.binary

  app:
    name: Build & test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r app/requirements-dev.txt

      - name: Run tests
        working-directory: app
        run: python -m pytest -v

      - name: Build Docker image (no push)
        run: docker build -t finzla-assessment:pr-${{ github.event.pull_request.number }} .

      # Quality/security check required by the assessment: scan the
      # built image for known-vulnerable OS/Python packages.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finzla-assessment:pr-${{ github.event.pull_request.number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  iac-security-scan:
    name: IaC security scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          quiet: true
          soft_fail: true # non-blocking findings visible in the Checks tab; tighten to false once the baseline is clean
